
[package]
name = "rustkv"
version = "0.1.0"
edition = "2021"
description = "An embedded concurrent key-value store for Rust learning"

[lib]
name = "rustkv"
path = "src/lib.rs"

[[bin]]
name = "rustkv"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
